<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photobooth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d1a;
      color: #fff;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #preview-wrap {
      display: none;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      overflow: hidden;
      background: #1a1a2e;
      aspect-ratio: 3/4;
    }

    #preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .btn {
      margin-top: 18px;
      width: 100%;
      max-width: 420px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:not(:disabled):active { opacity: 0.8; }

    #btn-shoot {
      background: linear-gradient(135deg, #ff6ec7, #ffe066);
      color: #000;
    }

    #btn-go {
      background: linear-gradient(135deg, #6ec6ff, #ff6ec7);
      color: #000;
      display: none;
    }

    #btn-retry {
      background: #2a2a3e;
      color: #fff;
      display: none;
    }

    #status {
      margin-top: 14px;
      text-align: center;
      font-size: 0.9rem;
      color: #aaa;
      min-height: 22px;
    }

    .esc-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px 20px;
      width: 100%;
      max-width: 420px;
    }

    .esc-screen .esc-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .esc-screen h2 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6ec7, #ffe066, #6ec6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .esc-screen p {
      color: #aaa;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .esc-screen small {
      color: #555;
      font-size: 0.8rem;
    }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid #444;
      border-top-color: #ff6ec7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <input type="file" id="photo-input" accept="image/*" capture="user" style="display:none">

  <div id="preview-wrap">
    <img id="preview-img" alt="Dein Foto">
  </div>

  <button class="btn" id="btn-shoot">📸 Foto aufnehmen</button>
  <button class="btn" id="btn-go">✨ Mach mich Song Contest!</button>
  <button class="btn" id="btn-retry">🔄 Nochmal</button>

  <div id="status"></div>

  <div id="waiting" class="esc-screen">
    <div class="esc-icon">✨</div>
    <h2>Vielen Dank!</h2>
    <p><span class="spinner"></span>Einen Moment bitte…</p>
    <small>(Browser nicht schließen)</small>
  </div>

  <div id="thankyou" class="esc-screen">
    <div class="esc-icon">🎤</div>
    <h2>Vielen Dank, und willkommen beim ESC Wien 2026!</h2>
    <p>Dein Look erscheint gleich auf dem grossen Bildschirm.</p>
  </div>

  <script>
    // ─── KONFIGURATION ────────────────────────────────────────────────────────
    const FAL_API_KEY        = "cd2bee40-c3b8-41b6-852a-072e8c75666e:9587576d9d41e708eac55ab095bb1fef";          // fal.ai → API Keys
    const CLOUDINARY_CLOUD   = "djwn28ean";          // Cloudinary → Dashboard
    const CLOUDINARY_PRESET  = "esc_img_upload";       // Cloudinary → Settings → Upload Presets (unsigned)
    // ─────────────────────────────────────────────────────────────────────────

    // ─── RANDOM PROMPT BUILDER ────────────────────────────────────────────────
    function pickPrompt() {
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function pickN(arr, n) {
        const shuffled = [...arr].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, n);
      }

      const outfitBase = [
        "a dramatic full-length sequinned gown",
        "a sparkling bodysuit with a billowing skirt",
        "an extravagant tailored jumpsuit",
        "a bold structured mini dress",
        "a glittering oversized blazer and matching shorts",
        "a lavish floor-length cape over a sleek catsuit",
        "a voluminous ballgown with a structured bodice",
      ];

      const colorPalette = [
        "in electric blue and silver",
        "in hot pink and gold",
        "in deep purple and iridescent white",
        "in neon green and chrome",
        "in scarlet red and black glitter",
        "in rainbow gradient hues",
        "in rose gold and champagne",
        "in cobalt blue and blinding gold",
        "in midnight black covered in rhinestones",
        "in acid yellow and fuchsia",
      ];

      const embellishments = [
        "covered in thousands of tiny rhinestones",
        "adorned with large pink ostrich feathers along the hem and collar",
        "decorated with oversized iridescent sequins",
        "trimmed with white marabou feathers",
        "encrusted with mirror tiles that catch the light",
        "layered with holographic fringe",
        "studded with pearl and crystal clusters",
        "draped with metallic chain details",
        "covered in hand-sewn paillettes that shimmer with every move",
        "embroidered with colourful crystal flowers",
      ];

      const accessories = [
        "topped with a towering feathered headdress",
        "paired with dramatic opera gloves",
        "finished with a sweeping feather boa",
        "completed by an oversized rhinestone tiara",
        "accented with enormous statement earrings",
        "paired with thigh-high metallic boots",
        "finished with a shimmering cape flowing to the floor",
      ];

      const backgrounds = [
        "Replace the background with a pure abstract swirl of soft purple and pink light haze, no objects, no people",
        "Replace the background with deep darkness and sweeping multicolored spotlights fanning outward, no objects, no people",
        "Replace the background with a rich navy-to-black gradient washed in warm golden light beams, no objects, no people",
        "Replace the background with an electric blue and violet light-wash gradient, no objects, no people",
        "Replace the background with a moody dark background with soft neon pink and cyan light glows bleeding in from the sides, no objects, no people",
        "Replace the background with a shimmering silver-to-black gradient with subtle bokeh light circles, no objects, no people",
        "Replace the background with a deep magenta and amber colour-wash fading to black, no objects, no people",
        "Replace the background with a dark background pierced by thin, soft laser-like beams of white and gold light, no objects, no people",
        "Replace the background with a hazy teal and indigo gradient lit by unseen coloured stage lights, no objects, no people",
        "Replace the background with a velvety dark background with slowly radiating soft rainbow light rings, no objects, no people",
      ];

      const outfit   = pick(outfitBase);
      const color    = pick(colorPalette);
      const details  = pickN(embellishments, 2).join(" and ");
      const accessory = pick(accessories);
      const bg       = pick(backgrounds);

      return (
        `Leave the face of the person completely unchanged and realistic. ` +
        `Transform their clothing into ${outfit} ${color}, ${details}, ${accessory}. ` +
        `The outfit should look like a spectacular Eurovision Song Contest stage costume. ` +
        `${bg}. ` +
        `No nudity, no see-through fabric, no exposed skin beyond what is tasteful.`
      );
    }
    // ─────────────────────────────────────────────────────────────────────────

    const photoInput  = document.getElementById("photo-input");
    const previewWrap = document.getElementById("preview-wrap");
    const previewImg  = document.getElementById("preview-img");
    const btnShoot    = document.getElementById("btn-shoot");
    const btnGo       = document.getElementById("btn-go");
    const btnRetry    = document.getElementById("btn-retry");
    const status      = document.getElementById("status");
    const waiting     = document.getElementById("waiting");
    const thankyou    = document.getElementById("thankyou");

    let capturedDataUrl = null;

    function setStatus(msg, loading = false) {
      status.innerHTML = loading
        ? `<span class="spinner"></span>${msg}`
        : msg;
    }

    function showShootScreen() {
      previewWrap.style.display = "none";
      btnShoot.style.display   = "block";
      btnGo.style.display      = "none";
      btnRetry.style.display   = "none";
      waiting.style.display    = "none";
      thankyou.style.display   = "none";
      setStatus("");
      capturedDataUrl = null;
    }

    // "Foto aufnehmen" → öffnet native Kamera-App
    btnShoot.addEventListener("click", () => {
      photoInput.value = "";
      photoInput.click();
    });

    // Foto wurde aufgenommen → Vorschau zeigen
    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        capturedDataUrl = e.target.result;
        previewImg.src = capturedDataUrl;
        previewWrap.style.display = "block";
        btnShoot.style.display    = "none";
        btnGo.style.display       = "block";
        btnRetry.style.display    = "block";
      };
      reader.readAsDataURL(file);
    });

    // "Nochmal" → zurück zur Kamera
    btnRetry.addEventListener("click", showShootScreen);

    // base64 → FLUX Kontext Pro → KI-Bild URL
    async function generateOutfit(base64Image) {
      const payload = {
        prompt: pickPrompt(),
        image_url: base64Image,
        guidance_scale: 3.5,
        num_images: 1,
        output_format: "jpeg",
        safety_tolerance: "6",
        enhance_prompt: false,
        aspect_ratio: "3:4"
      };

      const response = await fetch("https://fal.run/fal-ai/flux-pro/kontext", {
        method: "POST",
        headers: {
          "Authorization": `Key ${FAL_API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });
      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`fal.ai Fehler: ${response.status} – ${errText}`);
      }
      const data = await response.json();
      return data.images[0].url;
    }

    // AI-Ergebnis-URL → Cloudinary hochladen
    async function uploadResultToCloudinary(imageUrl) {
      const imgBlob = await fetch(imageUrl).then(r => r.blob());

      const form = new FormData();
      form.append("file", imgBlob);
      form.append("upload_preset", CLOUDINARY_PRESET);
      form.append("folder", "party-photobooth");
      form.append("tags", "party,songcontest");

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,
        { method: "POST", body: form }
      );
      if (!response.ok) throw new Error(`Cloudinary Fehler: ${response.status}`);
    }

    // Haupt-Flow: Foto bestätigen → KI → Upload
    btnGo.addEventListener("click", async () => {
      if (!capturedDataUrl) return;
      btnGo.disabled    = true;
      btnRetry.disabled = true;

      try {
        previewWrap.style.display = "none";
        btnGo.style.display       = "none";
        btnRetry.style.display    = "none";
        waiting.style.display     = "flex";

        const aiImageUrl = await generateOutfit(capturedDataUrl);
        await uploadResultToCloudinary(aiImageUrl);

        waiting.style.display  = "none";
        thankyou.style.display = "flex";

      } catch (e) {
        console.error(e);
        waiting.style.display = "none";
        setStatus("❌ Fehler: " + e.message);
        previewWrap.style.display = "block";
        btnGo.style.display       = "block";
        btnRetry.style.display    = "block";
      } finally {
        btnGo.disabled    = false;
        btnRetry.disabled = false;
      }
    });
  </script>
</body>
</html>
