<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎤 Song Contest Photobooth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d1a;
      color: #fff;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ff6ec7, #ffe066, #6ec6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    #camera-wrap {
      position: relative;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      overflow: hidden;
      background: #1a1a2e;
      aspect-ratio: 3/4;
    }

    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    canvas { display: none; }

    .btn {
      margin-top: 18px;
      width: 100%;
      max-width: 420px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:not(:disabled):active { opacity: 0.8; }

    #btn-shoot {
      background: linear-gradient(135deg, #ff6ec7, #ffe066);
      color: #000;
    }

    #btn-retry {
      background: #2a2a3e;
      color: #fff;
      display: none;
    }

    #status {
      margin-top: 14px;
      text-align: center;
      font-size: 0.9rem;
      color: #aaa;
      min-height: 22px;
    }

    #result-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }

    #result-img {
      width: 100%;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid #444;
      border-top-color: #ff6ec7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <h1>🎤 Song Contest Photobooth</h1>
  <p class="subtitle">Mach ein Foto – die KI zieht dir ein Outfit an!</p>

  <div id="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <button class="btn" id="btn-shoot">📸 Foto schießen</button>
  <button class="btn" id="btn-retry">🔄 Nochmal versuchen</button>

  <div id="result-wrap">
    <img id="result-img" src="" alt="Dein Song-Contest-Look" />
  </div>

  <div id="status"></div>

  <script>
    // ─── KONFIGURATION ────────────────────────────────────────────────────────
    const FAL_API_KEY        = "cd2bee40-c3b8-41b6-852a-072e8c75666e:9587576d9d41e708eac55ab095bb1fef";          // fal.ai → API Keys
    const CLOUDINARY_CLOUD   = "djwn28ean";          // Cloudinary → Dashboard
    const CLOUDINARY_PRESET  = "esc_img_upload";       // Cloudinary → Settings → Upload Presets (unsigned)
    // ─────────────────────────────────────────────────────────────────────────

    const PROMPT = "Replace only the person's clothing with a flamboyant Eurovision Song Contest stage costume covered in sequins, feathers and glitter. Keep the person's face, hair, skin tone, body shape, pose and the background completely unchanged.";

    const video      = document.getElementById("video");
    const canvas     = document.getElementById("canvas");
    const btnShoot   = document.getElementById("btn-shoot");
    const btnRetry   = document.getElementById("btn-retry");
    const status     = document.getElementById("status");
    const resultWrap = document.getElementById("result-wrap");
    const resultImg  = document.getElementById("result-img");

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1440 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (e) {
        setStatus("❌ Kamera-Zugriff verweigert. Bitte erlauben und neu laden.");
        btnShoot.disabled = true;
      }
    }

    function setStatus(msg, loading = false) {
      status.innerHTML = loading
        ? `<span class="spinner"></span>${msg}`
        : msg;
    }

    function capturePhoto() {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      return canvas.toDataURL("image/jpeg", 0.85);
    }

    // base64 → FLUX Kontext → KI-Bild URL
    async function generateOutfit(base64Image) {
      const payload = {
        prompt: PROMPT,
        image_url: base64Image,
        num_inference_steps: 28,
        guidance_scale: 3.5,
        num_images: 1,
        enable_safety_checker: false,
        output_format: "jpeg",
        acceleration: "high",
        resolution_mode: "match_input"
      };

      const response = await fetch("https://fal.run/fal-ai/flux-kontext/dev", {
        method: "POST",
        headers: {
          "Authorization": `Key ${FAL_API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });
      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`fal.ai Fehler: ${response.status} – ${errText}`);
      }
      const data = await response.json();
      return data.images[0].url;
    }

    // Ergebnis-URL → Cloudinary hochladen (mit Party-Tags für Slideshow)
    async function uploadResultToCloudinary(imageUrl) {
      const imgBlob = await fetch(imageUrl).then(r => r.blob());

      const form = new FormData();
      form.append("file", imgBlob);
      form.append("upload_preset", CLOUDINARY_PRESET);
      form.append("folder", "party-photobooth");
      form.append("tags", "party,songcontest");

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,
        { method: "POST", body: form }
      );
      if (!response.ok) throw new Error(`Cloudinary Fehler: ${response.status}`);
      const data = await response.json();
      return data.secure_url;
    }

    // Haupt-Flow
    btnShoot.addEventListener("click", async () => {
      btnShoot.disabled = true;
      btnRetry.style.display = "none";
      resultWrap.style.display = "none";

      try {
        // 1. Foto machen
        setStatus("Foto aufgenommen...");
        const base64 = capturePhoto();
        video.style.display = "none";
        canvas.style.display = "block";

        // 2. KI generiert Outfit
        setStatus("🎨 KI zieht dir ein Outfit an…", true);
        const aiImageUrl = await generateOutfit(base64);

        // 3. Ergebnis zu Cloudinary hochladen
        setStatus("⬆️ Bild wird gespeichert…", true);
        const cloudUrl = await uploadResultToCloudinary(aiImageUrl);

        // 4. Ergebnis zeigen
        resultImg.src = cloudUrl;
        resultWrap.style.display = "flex";
        setStatus("🌟 Dein Song-Contest-Look ist fertig!");

      } catch (e) {
        console.error(e);
        setStatus("❌ Fehler: " + e.message);
        video.style.display = "block";
        canvas.style.display = "none";
        btnRetry.style.display = "block";
      } finally {
        btnShoot.disabled = false;
        btnShoot.textContent = "📸 Neues Foto";
      }
    });

    btnRetry.addEventListener("click", () => {
      video.style.display = "block";
      canvas.style.display = "none";
      btnRetry.style.display = "none";
      resultWrap.style.display = "none";
      setStatus("");
      btnShoot.textContent = "📸 Foto schießen";
    });

    startCamera();
  </script>
</body>
</html>
