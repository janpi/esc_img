<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photobooth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d1a;
      color: #fff;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ff6ec7, #ffe066, #6ec6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    #camera-wrap {
      position: relative;
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      overflow: hidden;
      background: #1a1a2e;
      aspect-ratio: 3/4;
    }

    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    canvas { display: none; }

    .btn {
      margin-top: 18px;
      width: 100%;
      max-width: 420px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:not(:disabled):active { opacity: 0.8; }

    #btn-shoot {
      background: linear-gradient(135deg, #ff6ec7, #ffe066);
      color: #000;
    }

    #btn-retry {
      background: #2a2a3e;
      color: #fff;
      display: none;
    }

    #status {
      margin-top: 14px;
      text-align: center;
      font-size: 0.9rem;
      color: #aaa;
      min-height: 22px;
    }

    #result-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }

    #result-img {
      width: 100%;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    #thankyou {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px 20px;
      width: 100%;
      max-width: 420px;
    }

    #thankyou .esc-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    #thankyou h2 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6ec7, #ffe066, #6ec6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    #thankyou p {
      color: #aaa;
      font-size: 1rem;
    }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid #444;
      border-top-color: #ff6ec7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <button class="btn" id="btn-shoot">📸 Foto machen</button>
  <button class="btn" id="btn-retry">🔄 Nochmal</button>

  <div id="status"></div>

  <div id="thankyou">
    <div class="esc-icon">🎤</div>
    <h2>Vielen Dank, und willkommen beim ESC 2026!</h2>
    <p>Dein Look erscheint gleich auf dem grossen Bildschirm.</p>
  </div>

  <script>
    // ─── KONFIGURATION ────────────────────────────────────────────────────────
    const FAL_API_KEY        = "cd2bee40-c3b8-41b6-852a-072e8c75666e:9587576d9d41e708eac55ab095bb1fef";          // fal.ai → API Keys
    const CLOUDINARY_CLOUD   = "djwn28ean";          // Cloudinary → Dashboard
    const CLOUDINARY_PRESET  = "esc_img_upload";       // Cloudinary → Settings → Upload Presets (unsigned)
    // ─────────────────────────────────────────────────────────────────────────

    const PROMPT = "Change the clothes of the persons in the image. Give them a funny, vibrant, glittery Eurovision Song Contest outfit. Leave everything else – their face, the scene and background – unchanged.";

    const video      = document.getElementById("video");
    const canvas     = document.getElementById("canvas");
    const btnShoot   = document.getElementById("btn-shoot");
    const btnRetry   = document.getElementById("btn-retry");
    const status     = document.getElementById("status");
    const thankyou   = document.getElementById("thankyou");

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1080 }, height: { ideal: 1440 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (e) {
        setStatus("❌ Kamera-Zugriff verweigert. Bitte erlauben und neu laden.");
        btnShoot.disabled = true;
      }
    }

    function setStatus(msg, loading = false) {
      status.innerHTML = loading
        ? `<span class="spinner"></span>${msg}`
        : msg;
    }

    function capturePhoto() {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      return canvas.toDataURL("image/jpeg", 0.85);
    }

    // base64 → FLUX Kontext Pro → KI-Bild URL
    async function generateOutfit(base64Image) {
      const payload = {
        prompt: PROMPT,
        image_url: base64Image,
        guidance_scale: 3.5,
        num_images: 1,
        output_format: "jpeg",
        safety_tolerance: "6",
        enhance_prompt: false,
        aspect_ratio: "3:4"
      };

      const response = await fetch("https://fal.run/fal-ai/flux-pro/kontext", {
        method: "POST",
        headers: {
          "Authorization": `Key ${FAL_API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });
      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`fal.ai Fehler: ${response.status} – ${errText}`);
      }
      const data = await response.json();
      return data.images[0].url;
    }

    // base64 → Cloudinary (kein Slideshow-Tag, nur als Backup)
    async function uploadOriginalToCloudinary(base64Image) {
      const form = new FormData();
      form.append("file", base64Image);
      form.append("upload_preset", CLOUDINARY_PRESET);
      form.append("folder", "party-photobooth");

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,
        { method: "POST", body: form }
      );
      if (!response.ok) throw new Error(`Cloudinary Fehler: ${response.status}`);
    }

    // AI-Ergebnis-URL → Cloudinary hochladen (mit Slideshow-Tags)
    async function uploadResultToCloudinary(imageUrl) {
      const imgBlob = await fetch(imageUrl).then(r => r.blob());

      const form = new FormData();
      form.append("file", imgBlob);
      form.append("upload_preset", CLOUDINARY_PRESET);
      form.append("folder", "party-photobooth");
      form.append("tags", "party,songcontest");

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,
        { method: "POST", body: form }
      );
      if (!response.ok) throw new Error(`Cloudinary Fehler: ${response.status}`);
    }

    // Im Hintergrund: AI generieren + in Slideshow hochladen
    async function processInBackground(base64) {
      const aiImageUrl = await generateOutfit(base64);
      await uploadResultToCloudinary(aiImageUrl);
    }

    // Haupt-Flow
    btnShoot.addEventListener("click", async () => {
      btnShoot.disabled = true;
      btnRetry.style.display = "none";
      thankyou.style.display = "none";

      try {
        // 1. Foto machen
        setStatus("Einen Moment bitte…");
        const base64 = capturePhoto();
        video.style.display = "none";
        canvas.style.display = "block";

        // 2. Original hochladen (~2s) — danach Danke zeigen
        setStatus("Einen Moment bitte…", true);
        await uploadOriginalToCloudinary(base64);

        // 3. Danke-Screen zeigen
        canvas.style.display = "none";
        thankyou.style.display = "flex";
        setStatus("");

        // 4. AI + Slideshow-Upload im Hintergrund (nicht awaited)
        processInBackground(base64).catch(e => console.warn("Hintergrund-Fehler:", e));

      } catch (e) {
        console.error(e);
        setStatus("❌ Fehler: " + e.message);
        video.style.display = "block";
        canvas.style.display = "none";
        btnRetry.style.display = "block";
      } finally {
        btnShoot.disabled = false;
        btnShoot.textContent = "📸 Foto machen";
      }
    });

    btnRetry.addEventListener("click", () => {
      video.style.display = "block";
      canvas.style.display = "none";
      btnRetry.style.display = "none";
      thankyou.style.display = "none";
      setStatus("");
      btnShoot.textContent = "📸 Foto machen";
    });

    startCamera();
  </script>
</body>
</html>
