<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photobooth</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d1a;
      color: #fff;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .btn {
      margin-top: 18px;
      width: 100%;
      max-width: 420px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:not(:disabled):active { opacity: 0.8; }

    #btn-shoot {
      background: linear-gradient(135deg, #ff6ec7, #ffe066);
      color: #000;
    }

    #btn-retry {
      background: #2a2a3e;
      color: #fff;
      display: none;
    }


    #status {
      margin-top: 14px;
      text-align: center;
      font-size: 0.9rem;
      color: #aaa;
      min-height: 22px;
    }

    .esc-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px 20px;
      width: 100%;
      max-width: 420px;
    }

    .esc-screen .esc-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .esc-screen h2 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6ec7, #ffe066, #6ec6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .esc-screen p {
      color: #aaa;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .esc-screen small {
      color: #555;
      font-size: 0.8rem;
    }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 3px solid #444;
      border-top-color: #ff6ec7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #version {
      margin-top: 12px;
      font-size: 0.72rem;
      color: #666;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <input type="file" id="photo-input" accept="image/*" capture="user" style="display:none">

  <button class="btn" id="btn-shoot">📸 Foto aufnehmen</button>
  <div id="version">v2.6-debug</div>

  <div id="status"></div>

  <div id="waiting" class="esc-screen">
    <div class="esc-icon">✨</div>
    <h2>Einen Moment bitte…</h2>
    <p><span class="spinner"></span><span id="waiting-step">Bild wird vorbereitet…</span></p>
    <small id="waiting-timer"></small>
    <small>⚠️ Browser nicht schließen!</small>
  </div>

  <div id="thankyou" class="esc-screen">
    <div class="esc-icon">🎤</div>
    <h2>Vielen Dank, und willkommen beim ESC Wien 2026!</h2>
    <p>Dein Look erscheint in ca. 1 Minute auf dem grossen Bildschirm.</p>
    <small>⚠️ Browser noch kurz offen lassen!</small>
  </div>

  <button class="btn" id="btn-retry">🔄 Nochmal</button>
  <pre id="debug-log" style="margin-top:16px;font-size:0.7rem;color:#888;white-space:pre-wrap;width:100%;max-width:420px;word-break:break-all;"></pre>

  <script>
    // ─── KONFIGURATION ────────────────────────────────────────────────────────
    const FAL_API_KEY        = "cd2bee40-c3b8-41b6-852a-072e8c75666e:9587576d9d41e708eac55ab095bb1fef";          // fal.ai → API Keys
    const CLOUDINARY_CLOUD   = "djwn28ean";          // Cloudinary → Dashboard
    const CLOUDINARY_PRESET  = "esc_img_upload";       // Cloudinary → Settings → Upload Presets (unsigned)
    // ─────────────────────────────────────────────────────────────────────────

    // ─── RANDOM PROMPT BUILDER ────────────────────────────────────────────────
    function pickPrompt() {
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
      function pickN(arr, n) {
        const shuffled = [...arr].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, n);
      }

      const outfitBase = [
        "an extravagant tailored jumpsuit",
        "a glittering oversized blazer with matching wide-leg trousers",
        "a lavish floor-length cape over a sleek fitted outfit",
        "a spectacular sequinned stage suit with dramatic lapels",
        "a bold structured performance outfit with architectural shoulders",
        "a dazzling rhinestone-encrusted suit",
        "a striking metallic two-piece stage costume",
        "an opulent velvet tailcoat with embellished trousers",
      ];

      const colorPalette = [
        "in electric blue and silver",
        "in hot pink and gold",
        "in deep purple and iridescent white",
        "in neon green and chrome",
        "in scarlet red and black glitter",
        "in rainbow gradient hues",
        "in rose gold and champagne",
        "in cobalt blue and blinding gold",
        "in midnight black covered in rhinestones",
        "in acid yellow and fuchsia",
      ];

      const embellishments = [
        "covered in thousands of tiny rhinestones",
        "adorned with large pink ostrich feathers along the hem and collar",
        "decorated with oversized iridescent sequins",
        "trimmed with white marabou feathers",
        "encrusted with mirror tiles that catch the light",
        "layered with holographic fringe",
        "studded with pearl and crystal clusters",
        "draped with metallic chain details",
        "covered in hand-sewn paillettes that shimmer with every move",
        "embroidered with colourful crystal flowers",
      ];

      const accessories = [
        "topped with a towering feathered headdress",
        "paired with dramatic opera gloves",
        "finished with a sweeping feather boa",
        "completed by an oversized rhinestone tiara",
        "accented with enormous statement earrings",
        "paired with thigh-high metallic boots",
        "finished with a shimmering cape flowing to the floor",
      ];

      const backgrounds = [
        "Replace the background with a pure abstract swirl of soft purple and pink light haze, no objects, no people",
        "Replace the background with deep darkness and sweeping multicolored spotlights fanning outward, no objects, no people",
        "Replace the background with a rich navy-to-black gradient washed in warm golden light beams, no objects, no people",
        "Replace the background with an electric blue and violet light-wash gradient, no objects, no people",
        "Replace the background with a moody dark background with soft neon pink and cyan light glows bleeding in from the sides, no objects, no people",
        "Replace the background with a shimmering silver-to-black gradient with subtle bokeh light circles, no objects, no people",
        "Replace the background with a deep magenta and amber colour-wash fading to black, no objects, no people",
        "Replace the background with a dark background pierced by thin, soft laser-like beams of white and gold light, no objects, no people",
        "Replace the background with a hazy teal and indigo gradient lit by unseen coloured stage lights, no objects, no people",
        "Replace the background with a velvety dark background with slowly radiating soft rainbow light rings, no objects, no people",
      ];

      const outfit   = pick(outfitBase);
      const color    = pick(colorPalette);
      const details  = pickN(embellishments, 2).join(" and ");
      const accessory = pick(accessories);
      const bg       = pick(backgrounds);

      return (
        `Leave the face, body, and gender of the person completely unchanged and realistic — keep men as men and women as women. ` +
        `Transform their clothing into ${outfit} ${color}, ${details}, ${accessory}. ` +
        `The outfit should look like a spectacular Eurovision Song Contest stage costume suited to their gender. ` +
        `${bg}. ` +
        `No nudity, no see-through fabric, no exposed skin beyond what is tasteful.`
      );
    }
    // ─────────────────────────────────────────────────────────────────────────

    const photoInput   = document.getElementById("photo-input");
    const btnShoot     = document.getElementById("btn-shoot");
    const btnRetry     = document.getElementById("btn-retry");
    const status       = document.getElementById("status");
    const waiting      = document.getElementById("waiting");
    const waitingStep  = document.getElementById("waiting-step");
    const waitingTimer = document.getElementById("waiting-timer");
    const thankyou     = document.getElementById("thankyou");

    let timerInterval = null;

    function startTimer() {
      const start = Date.now();
      waitingTimer.textContent = "";
      timerInterval = setInterval(() => {
        const s = Math.floor((Date.now() - start) / 1000);
        waitingTimer.textContent = `(${s}s)`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      waitingTimer.textContent = "";
    }

    function setStep(msg) {
      waitingStep.textContent = msg;
    }

    function setStatus(msg, loading = false) {
      status.innerHTML = loading
        ? `<span class="spinner"></span>${msg}`
        : msg;
    }

    function showShootScreen() {
      stopTimer();
      btnShoot.style.display  = "block";
      btnRetry.style.display  = "none";
      waiting.style.display   = "none";
      thankyou.style.display  = "none";
      setStatus("");
    }

    // "Foto aufnehmen" → öffnet native Kamera-App
    btnShoot.addEventListener("click", () => {
      photoInput.value = "";
      photoInput.click();
    });

    // Foto wurde aufgenommen → sofort verarbeiten
    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => resizeAndProcess(e.target.result);
      reader.readAsDataURL(file);
    });

    // "Nochmal" → zurück
    btnRetry.addEventListener("click", showShootScreen);

    // XHR-Wrapper: zuverlässiger als fetch auf iOS Safari
    function xhrPost(url, headers, body, timeoutMs = 30000) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", url);
        xhr.timeout = timeoutMs;
        for (const [k, v] of Object.entries(headers)) xhr.setRequestHeader(k, v);
        xhr.ontimeout = () => reject(new Error("Timeout nach " + (timeoutMs/1000) + "s"));
        xhr.onerror   = () => reject(new Error("Netzwerkfehler (XHR onerror)"));
        xhr.onload    = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(JSON.parse(xhr.responseText));
          } else {
            reject(new Error("HTTP " + xhr.status + ": " + xhr.responseText.slice(0, 200)));
          }
        };
        xhr.send(body);
      });
    }

    // dataUrl → Blob → Cloudinary (XHR multipart) → URL
    function uploadToCloudinaryXHR(dataUrl) {
      return new Promise((resolve, reject) => {
        log("blob konvertieren…");
        fetch(dataUrl).then(r => r.blob()).then(blob => {
          log("blob OK: " + blob.size + "b");
          const form = new FormData();
          form.append("file", blob, "photo.jpg");
          form.append("upload_preset", CLOUDINARY_PRESET);
          form.append("folder", "party-photobooth");
          form.append("tags", "original");

          const xhr = new XMLHttpRequest();
          xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`);
          xhr.timeout = 90000;
          xhr.upload.onprogress = e => {
            if (e.lengthComputable) log("upload: " + Math.round(e.loaded/e.total*100) + "%");
          };
          xhr.ontimeout = () => reject(new Error("Cloudinary timeout (90s)"));
          xhr.onerror   = () => reject(new Error("Cloudinary Netzwerkfehler"));
          xhr.onload    = () => {
            log("Cloudinary status: " + xhr.status);
            if (xhr.status >= 200 && xhr.status < 300) {
              resolve(JSON.parse(xhr.responseText).secure_url);
            } else {
              reject(new Error("Cloudinary " + xhr.status + ": " + xhr.responseText.slice(0, 200)));
            }
          };
          xhr.send(form);
        }).catch(reject);
      });
    }

    // URL → fal.ai Queue → KI-Bild URL (polling statt langer Einzelrequest)
    async function generateOutfit(imageUrl) {
      const payload = {
        prompt: pickPrompt(),
        image_url: imageUrl,
        guidance_scale: 3.5,
        num_images: 1,
        output_format: "jpeg",
        safety_tolerance: "6",
        enhance_prompt: false,
        aspect_ratio: "3:4"
      };

      // Job einreichen
      const submitRes = await fetch("https://queue.fal.run/fal-ai/flux-pro/kontext", {
        method: "POST",
        headers: {
          "Authorization": `Key ${FAL_API_KEY}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });
      if (!submitRes.ok) {
        const err = await submitRes.text();
        throw new Error(`fal.ai Submit Fehler: ${submitRes.status} – ${err}`);
      }
      const { request_id } = await submitRes.json();

      // Ergebnis pollen (alle 3 Sekunden, max. 5 Minuten)
      const statusUrl = `https://queue.fal.run/fal-ai/flux-pro/kontext/requests/${request_id}/status`;
      const resultUrl = `https://queue.fal.run/fal-ai/flux-pro/kontext/requests/${request_id}`;
      const deadline  = Date.now() + 5 * 60 * 1000;

      while (Date.now() < deadline) {
        await new Promise(r => setTimeout(r, 3000));

        const statusRes = await fetch(statusUrl, {
          headers: { "Authorization": `Key ${FAL_API_KEY}` }
        });
        if (!statusRes.ok) continue;
        const { status } = await statusRes.json();

        if (status === "COMPLETED") {
          const resultRes = await fetch(resultUrl, {
            headers: { "Authorization": `Key ${FAL_API_KEY}` }
          });
          if (!resultRes.ok) throw new Error("fal.ai Ergebnis konnte nicht geladen werden");
          const data = await resultRes.json();
          return data.images[0].url;
        }
        if (status === "FAILED") {
          throw new Error("fal.ai: Bildgenerierung fehlgeschlagen");
        }
      }
      throw new Error("fal.ai: Timeout nach 5 Minuten");
    }

    // AI-Ergebnis-URL → Cloudinary hochladen (via XHR)
    function uploadResultToCloudinary(imageUrl) {
      return new Promise((resolve, reject) => {
        const form = new FormData();
        form.append("file", imageUrl);
        form.append("upload_preset", CLOUDINARY_PRESET);
        form.append("folder", "party-photobooth");
        form.append("tags", "party,songcontest");

        const xhr = new XMLHttpRequest();
        xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`);
        xhr.timeout = 30000;
        xhr.ontimeout = () => reject(new Error("Cloudinary result timeout"));
        xhr.onerror   = () => reject(new Error("Cloudinary result Netzwerkfehler"));
        xhr.onload    = () => {
          log("Cloudinary result status: " + xhr.status);
          if (xhr.status >= 200 && xhr.status < 300) resolve();
          else reject(new Error("Cloudinary result " + xhr.status));
        };
        xhr.send(form);
      });
    }

    // Bild auf max. 1080×1440 skalieren, bevor es an die API geht
    function resizeImage(dataUrl, maxW, maxH) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          const ratio = Math.min(maxW / w, maxH / h);
          if (ratio < 1) { w = Math.round(w * ratio); h = Math.round(h * ratio); }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", 0.85));
        };
        img.src = dataUrl;
      });
    }

    async function resizeAndProcess(dataUrl) {
      const resized = await resizeImage(dataUrl, 1080, 1440);
      processPhoto(resized);
    }

    // Haupt-Flow: Foto hochladen → KI-Job einreichen → sofort Danke zeigen
    async function processPhoto(dataUrl) {
      btnShoot.style.display = "none";
      waiting.style.display  = "flex";
      startTimer();

      try {
        setStep("1) Foto wird hochgeladen…");
        const imageUrl = await uploadToCloudinaryXHR(dataUrl);

        setStep("2) Sende an KI…");
        log("submitOutfitJob starten");
        await submitOutfitJob(imageUrl);
        log("submitOutfitJob OK");

        setStep("3) Job eingereicht ✨ Gleich fertig…");
        await new Promise(r => setTimeout(r, 4000));

        stopTimer();
        waiting.style.display  = "none";
        thankyou.style.display = "flex";
        btnRetry.style.display = "block";

      } catch (e) {
        stopTimer();
        log("FEHLER: " + e.message);
        waiting.style.display = "none";
        setStatus("❌ " + e.message);
        btnShoot.style.display = "block";
        btnRetry.style.display = "block";
      }
    }

    // Einfaches On-Screen-Log für Mobile-Debugging
    function log(msg) {
      console.log(msg);
      const el = document.getElementById("debug-log");
      if (el) el.textContent += "\n" + msg;
    }

    // Job einreichen und Ergebnis im Hintergrund zu Cloudinary hochladen
    async function submitOutfitJob(imageUrl) {
      const payload = {
        prompt: pickPrompt(),
        image_url: imageUrl,
        guidance_scale: 3.5,
        num_images: 1,
        output_format: "jpeg",
        safety_tolerance: "6",
        enhance_prompt: false,
        aspect_ratio: "3:4"
      };

      log("fal.ai queue XHR starten");
      const submitData = await xhrPost(
        "https://queue.fal.run/fal-ai/flux-pro/kontext",
        { "Authorization": `Key ${FAL_API_KEY}`, "Content-Type": "application/json" },
        JSON.stringify(payload),
        20000
      );
      const request_id = submitData.request_id;
      log("request_id: " + request_id);

      // Hintergrund-Polling: Ergebnis zu Cloudinary hochladen wenn fertig
      pollAndUpload(request_id);
    }

    function xhrGet(url, headers) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", url);
        xhr.timeout = 10000;
        for (const [k, v] of Object.entries(headers)) xhr.setRequestHeader(k, v);
        xhr.ontimeout = () => reject(new Error("GET timeout"));
        xhr.onerror   = () => reject(new Error("GET error"));
        xhr.onload    = () => {
          if (xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText));
          else reject(new Error("GET " + xhr.status));
        };
        xhr.send();
      });
    }

    async function pollAndUpload(request_id) {
      const resultUrl = `https://queue.fal.run/fal-ai/flux-pro/kontext/requests/${request_id}`;
      const deadline  = Date.now() + 5 * 60 * 1000;
      let pollCount   = 0;

      while (Date.now() < deadline) {
        await new Promise(r => setTimeout(r, 4000));
        pollCount++;
        try {
          const xhr = new XMLHttpRequest();
          const result = await new Promise((resolve, reject) => {
            xhr.open("GET", resultUrl);
            xhr.setRequestHeader("Authorization", `Key ${FAL_API_KEY}`);
            xhr.timeout = 10000;
            xhr.ontimeout = () => reject(new Error("timeout"));
            xhr.onerror   = () => reject(new Error("network"));
            xhr.onload    = () => resolve({ status: xhr.status, body: xhr.responseText });
            xhr.send();
          });

          log("poll #" + pollCount + " → HTTP " + result.status);

          if (result.status === 200) {
            const data = JSON.parse(result.body);
            if (data.images && data.images[0]) {
              log("KI fertig! Upload zu Cloudinary…");
              await uploadResultToCloudinary(data.images[0].url);
              log("✅ fertig!");
              return;
            }
            // Status-Infos loggen falls kein Bild
            log("body: " + result.body.slice(0, 150));
          } else if (result.status === 400 || result.status === 500) {
            log("FEHLER vom Server: " + result.body.slice(0, 150));
            return;
          }
          // 202 = noch nicht fertig, weiter pollen
        } catch (e) { log("poll #" + pollCount + " error: " + e.message); }
      }
      log("poll timeout nach 5min");
    }
  </script>
</body>
</html>
