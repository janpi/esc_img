<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slideshow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #slide-a, #slide-b {
      position: absolute;
      inset: 0;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #000;
      transition: opacity 1.2s ease;
    }

    #slide-a { opacity: 1; z-index: 1; }
    #slide-b { opacity: 0; z-index: 2; }
  </style>
</head>
<body>

  <!-- ─── KONFIGURATION ──────────────────────────────────────────────── -->
  <script>
    const CLOUDINARY_CLOUD = "djwn28ean";
    const SLIDE_DURATION   = 6000;   // Millisekunden pro Bild
    const POLL_INTERVAL    = 8000;   // Wie oft nach neuen Bildern suchen
  </script>
  <!-- ──────────────────────────────────────────────────────────────────── -->

  <div id="slide-a"></div>
  <div id="slide-b"></div>

  <script>
    const slideA   = document.getElementById("slide-a");
    const slideB   = document.getElementById("slide-b");

    let images       = [];
    let currentIndex = 0;
    let activeSlide  = "a";
    let slideTimer   = null;

    // ── Cloudinary Bildliste laden ──────────────────────────────────────
    // Wir laden einfach die letzte bekannte Bild-ID aus localStorage und
    // fragen Cloudinary per Search API nach allen Bildern im Ordner.
    // Die Search API braucht einen API Key – stattdessen nutzen wir einen
    // einfachen Trick: wir speichern jede hochgeladene URL in localStorage
    // (geschrieben von index.html via BroadcastChannel / localStorage).
    // Fallback: Cloudinary "named transformations list" via tag-basierter URL.

    async function fetchImages() {
      try {
        // Cloudinary unterstützt tag-basierte Bildlisten ohne Auth:
        // https://res.cloudinary.com/<cloud>/image/list/<tag>.json
        // Voraussetzung: in Cloudinary Settings → Security →
        // "Resource list" muss aktiviert sein (einmalig, gratis).
        const response = await fetch(
          `https://res.cloudinary.com/${CLOUDINARY_CLOUD}/image/list/songcontest.json`,
          { cache: "no-store" }
        );
        if (!response.ok) {
          console.warn("Cloudinary list nicht erreichbar:", response.status);
          return;
        }
        const data = await response.json();

        const urls = (data.resources || [])
          .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
          .map(r => `https://res.cloudinary.com/${CLOUDINARY_CLOUD}/image/upload/q_auto,f_auto,w_1920/${r.public_id}`);

        const hadImages = images.length > 0;
        const newCount  = urls.length;

        if (newCount > images.length) {
          const newUrls = urls.slice(0, newCount - images.length);
          images = [...newUrls, ...images];
        }

        if (images.length > 0 && !hadImages) startSlideshow();
      } catch (e) {
        console.warn("Fetch-Fehler:", e);
      }
    }

    // ── Slideshow ───────────────────────────────────────────────────────
    function showSlide(url) {
      const incoming = activeSlide === "a" ? slideB : slideA;
      const outgoing = activeSlide === "a" ? slideA : slideB;

      incoming.style.backgroundImage = `url('${url}')`;
      incoming.style.opacity = "1";
      incoming.style.zIndex  = "2";
      outgoing.style.opacity = "0";
      outgoing.style.zIndex  = "1";

      activeSlide = activeSlide === "a" ? "b" : "a";
    }

    function nextSlide() {
      if (images.length === 0) return;
      showSlide(images[currentIndex]);
      currentIndex = (currentIndex + 1) % images.length;
    }

    function startSlideshow() {
      nextSlide();
      slideTimer = setInterval(nextSlide, SLIDE_DURATION);
    }

    // ── Init ────────────────────────────────────────────────────────────
    fetchImages();
    setInterval(fetchImages, POLL_INTERVAL);
  </script>
</body>
</html>
