<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slideshow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #slide-a, #slide-b {
      position: absolute;
      inset: 0;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #000;
      transition: opacity 0.5s ease;
    }

    #slide-a { opacity: 1; z-index: 1; }
    #slide-b { opacity: 0; z-index: 2; }

    #progress {
      position: fixed;
      bottom: 0; left: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff6ec7, #ffe066);
      z-index: 20;
      width: 0%;
      transition: width linear;
    }

    #empty {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      background: #000;
    }

    .esc-heart {
      width: 160px;
      height: 160px;
      margin-bottom: 32px;
      animation: heartbeat 2.4s ease-in-out infinite;
      filter: drop-shadow(0 0 32px rgba(255, 110, 199, 0.5));
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%       { transform: scale(1.08); }
      28%       { transform: scale(1); }
      42%       { transform: scale(1.05); }
      56%       { transform: scale(1); }
    }

    .esc-wordmark {
      font-family: system-ui, sans-serif;
      font-size: clamp(1rem, 3vw, 1.6rem);
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0.7;
      margin-bottom: 8px;
    }

    .esc-year {
      font-family: system-ui, sans-serif;
      font-size: clamp(4rem, 14vw, 9rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #ff6ec7 0%, #ffe066 50%, #6ec6ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .esc-city {
      font-family: system-ui, sans-serif;
      font-size: clamp(0.9rem, 2.5vw, 1.3rem);
      font-weight: 400;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #fff;
      opacity: 0.45;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- ─── KONFIGURATION ──────────────────────────────────────────────── -->
  <script>
    const CLOUDINARY_CLOUD = "djwn28ean";
    const SLIDE_DURATION   = 4500;   // Millisekunden pro Bild
    const POLL_INTERVAL    = 5000;   // Wie oft nach neuen Bildern suchen
  </script>
  <!-- ──────────────────────────────────────────────────────────────────── -->

  <div id="empty">
    <svg class="esc-heart" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#ff6ec7"/>
          <stop offset="50%"  stop-color="#ffe066"/>
          <stop offset="100%" stop-color="#6ec6ff"/>
        </linearGradient>
      </defs>
      <path fill="url(#hg)" d="M50 85 C50 85 5 55 5 28 C5 14 16 5 28 5 C36 5 44 9 50 16 C56 9 64 5 72 5 C84 5 95 14 95 28 C95 55 50 85 50 85Z"/>
    </svg>
    <div class="esc-wordmark">Eurovision Song Contest</div>
    <div class="esc-year">2026</div>
    <div class="esc-city">Wien</div>
  </div>

  <div id="slide-a"></div>
  <div id="slide-b"></div>
  <div id="progress"></div>

  <script>
    const slideA   = document.getElementById("slide-a");
    const slideB   = document.getElementById("slide-b");
    const progress = document.getElementById("progress");
    const empty    = document.getElementById("empty");

    let images       = [];
    let currentIndex = 0;
    let activeSlide  = "a";
    let slideTimer   = null;

    // ── Cloudinary Bildliste laden ──────────────────────────────────────
    // Wir laden einfach die letzte bekannte Bild-ID aus localStorage und
    // fragen Cloudinary per Search API nach allen Bildern im Ordner.
    // Die Search API braucht einen API Key – stattdessen nutzen wir einen
    // einfachen Trick: wir speichern jede hochgeladene URL in localStorage
    // (geschrieben von index.html via BroadcastChannel / localStorage).
    // Fallback: Cloudinary "named transformations list" via tag-basierter URL.

    async function fetchImages() {
      try {
        // Cloudinary unterstützt tag-basierte Bildlisten ohne Auth:
        // https://res.cloudinary.com/<cloud>/image/list/<tag>.json
        // Voraussetzung: in Cloudinary Settings → Security →
        // "Resource list" muss aktiviert sein (einmalig, gratis).
        const response = await fetch(
          `https://res.cloudinary.com/${CLOUDINARY_CLOUD}/image/list/songcontest.json?t=${Date.now()}`,
          { cache: "no-store" }
        );
        if (!response.ok) {
          console.warn("Cloudinary list nicht erreichbar:", response.status);
          return;
        }
        const data = await response.json();

        const urls = (data.resources || [])
          .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
          .map(r => `https://res.cloudinary.com/${CLOUDINARY_CLOUD}/image/upload/q_auto,f_auto,w_1920/${r.public_id}`);

        const hadImages = images.length > 0;
        const newCount  = urls.length;

        if (newCount > images.length) {
          const newUrls = urls.slice(0, newCount - images.length);
          images = [...newUrls, ...images];
        }

        if (images.length > 0 && !hadImages) {
          empty.style.display = "none";
          startSlideshow();
        }
      } catch (e) {
        console.warn("Fetch-Fehler:", e);
      }
    }

    // ── Slideshow ───────────────────────────────────────────────────────
    function showSlide(url) {
      const incoming = activeSlide === "a" ? slideB : slideA;
      const outgoing = activeSlide === "a" ? slideA : slideB;

      incoming.style.backgroundImage = `url('${url}')`;
      incoming.style.opacity = "1";
      incoming.style.zIndex  = "2";
      outgoing.style.opacity = "0";
      outgoing.style.zIndex  = "1";

      activeSlide = activeSlide === "a" ? "b" : "a";
    }

    function animateProgress() {
      progress.style.transition = "none";
      progress.style.width = "0%";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        progress.style.transition = `width ${SLIDE_DURATION}ms linear`;
        progress.style.width = "100%";
      }));
    }

    function nextSlide() {
      if (images.length === 0) return;
      showSlide(images[currentIndex]);
      animateProgress();
      currentIndex = (currentIndex + 1) % images.length;
    }

    function startSlideshow() {
      nextSlide();
      slideTimer = setInterval(nextSlide, SLIDE_DURATION);
    }

    // ── Init ────────────────────────────────────────────────────────────
    fetchImages();
    setInterval(fetchImages, POLL_INTERVAL);
  </script>
</body>
</html>
